      resumo: 'O recrutador vê o mesmo perfil que você monta. Cada campo preenchido é um filtro em que você pode aparecer.',
      entender: `<section class="bl" data-t="Dois LinkedIns"><p class="nota-pequena">Aprofundamento. A visão geral está na aula 1.4</p><p>O LinkedIn que a maioria usa é feito para engajar: procurar emprego, criar contatos, publicar. O LinkedIn Recruiter é outro: uma ferramenta paga, feita para o recrutador buscar candidatos. Tem mais de 40 filtros. O recrutador não rola o feed: monta uma busca, combina filtros e vê só quem passa por todos.</p><div class="cx cx-regra"><b class="cx-t">Regra</b><p>Cada campo preenchido é um filtro em que você pode aparecer. Cada campo vazio é um filtro em que você fica de fora.</p></div></section><section class="bl" data-t="Os filtros principais, um por um"><div class="tb-rol"><table class="tb"><thead><tr><th scope="col">Filtro</th><th scope="col">Como o recrutador usa</th><th scope="col">O que você faz</th></tr></thead><tbody><tr><td>Cargo</td><td>Digita o cargo que procura, como "Analista de RH". Lê os cargos do perfil</td><td>Escreva o cargo na headline e nas experiências</td></tr><tr><td>Localização</td><td>Limita a uma cidade ou região</td><td>Cidade vazia ou errada = você some das buscas locais</td></tr><tr><td>Empresa</td><td>Busca quem trabalha ou já trabalhou em certa empresa</td><td>Escolha a empresa da lista do LinkedIn ao preencher a experiência</td></tr><tr><td>Competências</td><td>Busca quem tem determinada competência</td><td>Use os nomes que o mercado usa</td></tr><tr><td>Formação</td><td>Filtra por instituição, curso ou grau</td><td>Preencha a Formação</td></tr><tr><td>Idiomas</td><td>Filtra por idioma</td><td>Sem o campo preenchido, você não aparece nessa busca</td></tr><tr><td>Palavras-chave</td><td>Digita termos livres, com operadores</td><td>Use os termos da área no Sobre e nas experiências</td></tr><tr><td>Destaques (Spotlights)</td><td>Sinais para priorizar quem contatar. Não são uma nota</td><td>Open to Work, Active talent</td></tr></tbody></table></div></section><section class="bl" data-t="Operadores das palavras-chave"><ul><li>AND: os dois termos</li><li>OR: um ou outro</li><li>NOT: excluir</li><li>Aspas: expressão exata</li><li>Parênteses: agrupar</li></ul><p>A busca procura nos textos do perfil, como o Sobre e as experiências.</p></section><section class="bl" data-t="Como o recrutador combina os filtros"><p>Cada critério pode ser obrigatório, opcional ou excluído. Quando um critério é obrigatório, quem não tem aquele campo preenchido não aparece. Por isso o perfil completo, com os campos certos, passa por mais buscas do que o perfil enxuto.</p><div class="cx cx-regra"><b class="cx-t">Regra</b><p>Monte o perfil voltado para o LinkedIn Recruiter. Para cada filtro da tabela, confira qual campo do seu perfil o alimenta e se ele tem os termos que o recrutador digita.</p></div></section><details class="fontes"><summary>Fontes e limites</summary><p>Base: materiais do LinkedIn para empresas sobre o Recruiter. A tela da ferramenta muda com o tempo. Os cards desta aula são ilustrações didáticas, não capturas da tela real, e os nomes dos filtros estão em português para facilitar.</p></details>`,

      entender: `<section class="bl" data-t="O efeito bola de neve"><p>Uma palavra descreve o LinkedIn: efeito bola de neve. Uma ação puxa a outra, e o conjunto vai crescendo.</p></section><section class="bl" data-t="O que deve ser estratégico"><ul class="et-lista"><li>Os cargos que você quer ocupar</li><li>As conexões que você faz</li><li>Os posts que você comenta</li><li>Os comentários que você escreve</li><li>As páginas que você segue</li></ul><div class="cx cx-orient"><b class="cx-t">Orientação do tutorial</b><p>Para este tutorial, cada uma dessas ações gera engajamento, e o engajamento ajuda a levar o seu perfil a outras pessoas e empresas. Quando as ações combinam entre si e com o perfil, o conjunto fica claro: quem você é, o que faz e o que procura.</p></div></section><section class="bl" data-t="Por que não subestimar o LinkedIn"><ul><li>Existem sistemas de inteligência artificial em várias partes da plataforma.</li><li>O LinkedIn Recruiter busca candidatos por filtros, e o recrutador vê o mesmo perfil que você monta.</li><li>É uma ferramenta essencial no mercado de trabalho.</li></ul></section><section class="bl" data-t="Muito além do currículo"><div class="tb-rol"><table class="tb"><thead><tr><th scope="col">Currículo</th><th scope="col">LinkedIn</th></tr></thead><tbody><tr><td>1 ou 2 páginas, conciso</td><td>Mais riqueza de detalhes</td></tr><tr><td>Lista de fatos</td><td>Trajetória profissional, fotos e imagens, publicações e comentários</td></tr></tbody></table></div><p>Tudo isso de forma estratégica e com informações verdadeiras.</p><div class="cx cx-resumo"><b class="cx-t">Resumo</b><p>Outra palavra para o LinkedIn: o seu diário profissional. Registra, com detalhes, o que você fez, o que aprendeu e o que busca. Cada registro conta.</p></div></section>`,

   BLOCO 2 — NÚCLEO  (Eventos, Store, Router, Capitulos)
   ========================================================================== */
const Eventos = (() => {
  const m = {};
  return {
    on(n, f) { (m[n] = m[n] || []).push(f); },
    emit(n, d) { (m[n] || []).forEach(f => { try { f(d); } catch (e) { console.error(e); } }); }
  };
})();

const Store = (() => {
  const KEY = 'tutorial-linkedin-v1';
  const padrao = () => ({ concluidas: {}, persona: { foto: false, banner: false, headline: false, sobre: false, experiencia: false, formacao: false, competencias: false, apps: false, certificados: false, projetos: false, voluntariado: false, recomendacoes: false, cursos: false, projetoTexto: '', bannerTexto: '', headlineTexto: '', sobreTexto: '', experienciaTexto: '', formacaoTexto: '' } });
  let s = padrao();
  try { const r = localStorage.getItem(KEY); if (r) { const p = JSON.parse(r); s = { concluidas: p.concluidas || {}, persona: Object.assign(padrao().persona, p.persona) }; } } catch (e) { /* armazenamento bloqueado: segue só em memória */ }
  const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* ignora */ } };
  return {
    get: () => s,
    feito: k => !!s.concluidas[k],
    nota: k => s.concluidas[k] ? s.concluidas[k].nota : null,
    concluir(k, nota) { s.concluidas[k] = { nota: Math.round(nota) }; salvar(); Eventos.emit('progresso', k); },
    persona(patch) { Object.assign(s.persona, patch); salvar(); Eventos.emit('persona', s.persona); },
    reiniciar() { s = padrao(); salvar(); Eventos.emit('persona', s.persona); Eventos.emit('progresso'); }
  };
})();

const Router = {
  atual() { const p = location.hash.replace(/^#/, '').split('/'); return { cap: p[0] || null, aula: p[1] || null }; },
  ir(h) {
    const ir = () => { if (location.hash === h) Eventos.emit('rota', this.atual()); else location.hash = h; };
    const av = typeof Ordem !== 'undefined' ? Ordem.avisar(h, this.atual().cap, ir) : false;
    if (!av) ir();
  },
  iniciar() { window.addEventListener('hashchange', () => Eventos.emit('rota', this.atual())); }
};

/* Para validar o padrão de aula nesta fase, os capítulos são livres.
   As aulas DENTRO de cada capítulo seguem bloqueadas (uma libera a próxima). */
const CONFIG = { capitulosLivres: true };

const Capitulos = (() => {
  const lista = [];
  return {
    registrar(c) {
      const info = CONTEUDO.cap[c.id] || {};
      lista.push(Object.assign({ titulo: info.titulo, objetivo: info.objetivo, planejado: info.planejado || [], aulas: [] }, c));
      lista.sort((a, b) => ORDEM.indexOf(a.id) - ORDEM.indexOf(b.id));
    },
    todas: () => lista,
    num: c => ORDEM.indexOf(c.id) + 1,
    proximo: c => lista[lista.indexOf(c) + 1],
    obter: id => lista.find(c => String(c.id) === String(id)),
    chave: (c, a) => c.id + '.' + a.id,
    totalAulas: () => lista.reduce((n, c) => n + c.aulas.length, 0),
    feitasAulas: () => lista.reduce((n, c) => n + c.aulas.filter(a => Store.feito(c.id + '.' + a.id)).length, 0),
    capFeito: c => c.aulas.length > 0 && c.aulas.every(a => Store.feito(c.id + '.' + a.id)),
    aulaLiberada() { return true; }   // aulas livres: a ordem é recomendada, não obrigatória
  };
})();

/* ---- Aula 2.2 · SimuladorBanner (área segura) ---- */
function SimuladorBanner(el) {
  const st = { disp: 'desktop', x: IMAGENS.banner ? 48 : 30, y: 30, texto: Store.get().persona.bannerTexto || PERSONA.bannerForte };
  const stage = h('div', { class: 'sb-stage' });
  const txt = h('div', { class: 'sb-txt', tabindex: '0', 'aria-label': 'Texto do banner. Arraste ou use as setas do teclado.' });
  const status = h('div', { class: 'sb-status', 'aria-live': 'polite' });
  const input = h('input', { type: 'text', maxlength: '70', 'aria-label': 'Texto do banner', value: st.texto });
  const bD = h('button', { class: 'on', onclick: () => troca('desktop') }, 'Computador');
  const bC = h('button', { onclick: () => troca('celular') }, 'Celular');
  let drag = null;

  function troca(d) { st.disp = d; bD.classList.toggle('on', d === 'desktop'); bC.classList.toggle('on', d === 'celular'); desenhar(); }
  function desenhar() {
    stage.innerHTML = '';
    const zonas = LIMITES.bannerZonas[st.disp];
    zonas.forEach(z => stage.append(h('div', { class: 'sb-zone', style: 'left:' + z.x + '%;top:' + z.y + '%;width:' + z.w + '%;height:' + z.h + '%' }, z.motivo)));
    const zf = zonas.find(z => z.motivo === 'foto de perfil');
    if (zf) stage.append(h('div', { class: 'sb-av', style: 'left:' + (zf.x + zf.w * 0.06) + '%;top:' + (zf.y + 6) + '%;width:' + (zf.w * 0.88) + '%', html: Visuais.face(0.7) }));
    stage.append(txt);
    ajustar();
  }
  function ajustar() {
    txt.style.fontSize = Math.max(10, stage.clientWidth / 30) + 'px';
    txt.style.left = st.x + '%'; txt.style.top = st.y + '%';
    txt.textContent = st.texto || ' ';
    avaliar();
  }
  function avaliar() {
    const r = stage.getBoundingClientRect(), t = txt.getBoundingClientRect();
    if (!r.width) return;
    const x1 = (t.left - r.left) / r.width * 100, x2 = (t.right - r.left) / r.width * 100;
    const y1 = (t.top - r.top) / r.height * 100, y2 = (t.bottom - r.top) / r.height * 100;
    const hit = LIMITES.bannerZonas[st.disp].filter(z => x1 < z.x + z.w && x2 > z.x && y1 < z.y + z.h && y2 > z.y).map(z => z.motivo);
    const uniq = [...new Set(hit)];
    status.className = 'sb-status ' + (uniq.length ? 'warn' : 'ok');
    status.textContent = uniq.length ? '✗ Parte do texto cai em: ' + uniq.join(' e ') + '. Isso seria cortado ou coberto.'
      : '✓ Texto dentro da área segura neste aparelho.';
  }
  function mover(x, y) {
    const r = stage.getBoundingClientRect(), t = txt.getBoundingClientRect();
    st.x = clamp(x, 0, 100 - t.width / r.width * 100); st.y = clamp(y, 0, 100 - t.height / r.height * 100);
    txt.style.left = st.x + '%'; txt.style.top = st.y + '%'; avaliar();
  }
  txt.addEventListener('pointerdown', e => {
    const t = txt.getBoundingClientRect();
    drag = { dx: e.clientX - t.left, dy: e.clientY - t.top };
    try { txt.setPointerCapture(e.pointerId); } catch (err) { /* ignora */ }
    txt.classList.add('drag');
  });
  txt.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = stage.getBoundingClientRect();
    mover((e.clientX - drag.dx - r.left) / r.width * 100, (e.clientY - drag.dy - r.top) / r.height * 100);
  });
  const soltar = () => { drag = null; txt.classList.remove('drag'); };
  txt.addEventListener('pointerup', soltar); txt.addEventListener('pointercancel', soltar);
  txt.addEventListener('keydown', e => {
    const passo = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -2], ArrowDown: [0, 2] }[e.key];
    if (passo) { e.preventDefault(); mover(st.x + passo[0], st.y + passo[1]); }
  });
  input.addEventListener('input', () => { st.texto = input.value; ajustar(); });
  input.addEventListener('change', () => Store.persona({ bannerTexto: st.texto }));

  el.append(
    h('div', { class: 'ctrl' }, h('div', { class: 'seg' }, bD, bC), input,
      h('button', { class: 'btn peq', onclick: () => { st.x = IMAGENS.banner ? 48 : 30; st.y = st.disp === 'celular' ? 20 : 30; ajustar(); } }, 'Posicionar na área segura')),
    stage, status,
    h('p', { class: 'nota-pequena' }, 'Tamanho de referência do arquivo: ' + LIMITES.banner.w + ' x ' + LIMITES.banner.h + ' px (' + LIMITES.banner.proporcao + '), até ' + LIMITES.banner.pesoMaxMB + ' MB, ' + LIMITES.banner.formatos + '. As áreas vermelhas são aproximações didáticas: confira o seu banner no celular de verdade.'));
  desenhar();
  requestAnimationFrame(ajustar);
  if (window.ResizeObserver) new ResizeObserver(ajustar).observe(stage); else window.addEventListener('resize', ajustar);
}

function PalavrasChave(el) {
  const ta = h('textarea', { 'aria-label': 'Sua headline', placeholder: 'Ex.: Analista de RH | Analista de Recrutamento e Seleção' });
  ta.value = Store.get().persona.headlineTexto || '';

  const CARGO = /analista|assistente|auxiliar|coordenador|gerente|supervisor|recrutador|consultor|especialista|diretor|estagiari|tecnico|generalista|business partner|gestor de|head de|desenvolvedor|engenheiro|vendedor|representante|advogad|contador|professor|designer|programador|operador|motorista|atendente|secretari|administrador|comprador/;
  const partes = () => ta.value.split('|').map(x => x.trim()).filter(Boolean);

  function sincronizar() {
    const t = partes().join(' | ').slice(0, LIMITES.headline);
    if ((Store.get().persona.headlinePrev || '') !== t) Store.persona({ headlinePrev: t, headlineTexto: t || Store.get().persona.headlineTexto });
  }
  function colocar(texto) { ta.value = texto; ta.focus(); ta.setSelectionRange(texto.length, texto.length); render(); sincronizar(); }
  function alternar(cargo) {
    const segs = partes(), i = segs.findIndex(x => norm(x) === norm(cargo));
    if (i >= 0) { segs.splice(i, 1); colocar(segs.join(' | ')); return; }
    const ult = segs[segs.length - 1];
    if (ult && norm(cargo).startsWith(norm(ult)) && !/\|\s*$/.test(ta.value)) segs.pop();
    segs.push(cargo);
    colocar(segs.join(' | '));
  }
  function render() {
    const segs = partes();
    const itens = segs.map(t => {
      const n = norm(t), vago = PERSONA.termosVagos.some(k => n.includes(norm(k))), cargo = CARGO.test(n) && !vago;
      return { t, cargo, vago };
    });
    const nc = itens.filter(x => x.cargo).length;
    res.replaceChildren(...[
      h('p', {}, !segs.length ? 'Escreva sua headline acima, separando os trechos por "|".'
        : 'Cargos encontrados: ' + nc + (nc > 3 ? '. Passou de 3: reduza (o ideal são 2).' : nc === 3 ? '. É o máximo; o ideal são 2.' : nc === 2 ? '. É o ideal.' : '.')),
      itens.length ? h('div', { class: 'chips' }, itens.map(x => h('span', { class: 'chip ' + (x.cargo ? 'ok' : 'bad') }, (x.cargo ? '✓ ' : '✗ ') + x.t + (x.cargo ? '' : x.vago ? ' (adjetivo vago)' : ' (não parece cargo)')))) : null,
      itens.some(x => !x.cargo) ? h('p', { class: 'nota-pequena' }, 'Trechos que não são cargos (áreas, etapas, sistemas, competências) saem da headline e vão para o Sobre, as Experiências ou as Competências.') : null,
      h('p', { class: 'nota-pequena' }, 'Exemplos de cargos da área de RH (toque para adicionar ou tirar):'),
      h('div', { class: 'chips' }, PERSONA.cargosExemplo.map(k => {
        const usado = segs.some(x => norm(x) === norm(k));
        return h('button', { type: 'button', class: 'chip add' + (usado ? ' usado' : ''), 'aria-pressed': usado ? 'true' : 'false', onclick: () => alternar(k) }, (usado ? '✓ ' : '+ ') + k);
      }))
    ].filter(Boolean));
  }
  ta.addEventListener('input', e => {

}

const CEL_CORES = ['#0a66c2', '#0f7a6b', '#7a3fc0', '#b4501d', '#c2185b'];
function celQuadro(modo, titulo, sub) {
  return h('div', { class: 'cel ' + (modo === 'larga' ? 'cel-larga' : 'cel-m') },
    h('div', { class: 'cel-top' }, h('span', {}, '9:41'), h('span', {}, '5G ▮▮▮')),
    h('div', { class: 'cel-h' }, titulo, h('small', {}, sub)));
}
/* itens: [{ cab: [nós], corpo: [nós], aoAbrir?: fn }]  ->  { cel, notifs, fechar }  */
function celLista(itens, { titulo = 'Hoje', sub = 'Toque em uma notificação para abrir', onAbrir } = {}) {
  const cel = celQuadro('m', titulo, sub), notifs = [];
  const fecharTodas = except => notifs.forEach(n => { if (n !== except) { n.classList.remove('v'); n.firstChild.setAttribute('aria-expanded', 'false'); } });
  itens.forEach((it, i) => {
    const hd = h('div', { class: 'cel-hd', role: 'button', tabindex: '0', 'aria-expanded': 'false' },
      h('div', { class: 'cel-t' }, h('i', {}, 'in'), 'LINKEDIN · ' + (i + 1) + ' de ' + itens.length),
      h('div', { class: 'cel-tx' }, it.cab));
    const corpo = h('div', { class: 'cel-in' }, it.corpo);
    const n = h('div', { class: 'cel-n d', style: '--c:' + CEL_CORES[i % 5] }, hd, h('div', { class: 'cel-r' }, h('div', {}, corpo)));
    const alternar = () => {
      const abrir = !n.classList.contains('v');
      fecharTodas(abrir ? n : null);
      n.classList.toggle('v', abrir); hd.setAttribute('aria-expanded', abrir ? 'true' : 'false');
      if (abrir && it.aoAbrir) it.aoAbrir();
      if (onAbrir) onAbrir(i, abrir);
    };
    hd.addEventListener('click', alternar);
    hd.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternar(); } });
    const nota = corpo.querySelector('.nota-pequena');
    if (nota && window.MutationObserver) new MutationObserver(() => n.classList.toggle('f', !!nota.textContent.trim())).observe(nota, { childList: true, characterData: true, subtree: true });
    notifs.push(n); cel.append(n);
  });
  return { cel, notifs };
}
/* Converte uma prática que já tem cartões (.hl-card com título + botões + dica) em notificações */
function celDeCartoes(area, fn) {
  const tmp = h('div'); fn(tmp);
  const cards = Array.from(tmp.querySelectorAll('.hl-card'));
  if (cards.length) {
    const itens = cards.map(c => {
      const f = Array.from(c.children); let k = 0;
      while (k < f.length && /^(B|SPAN|SMALL)$/.test(f[k].tagName)) k++;
      if (k === 0) k = 1;
      return { cab: f.slice(0, k), corpo: f.slice(k) };
    });
    const { cel } = celLista(itens, { sub: 'Toque em uma tarefa para abrir' });
    cards[0].parentNode.insertBefore(cel, cards[0]); cards.forEach(c => c.remove());
  }
  area.append(...Array.from(tmp.childNodes));
}
/* Prática que é editor, simulador ou seleção: o conteúdo vai dentro da tela de um celular */
function celMoldura(area, fn) {
  const corpo = h('div', { class: 'cel-corpo' });
  fn(corpo);
  corpo.querySelectorAll('.chips').forEach(c => { const b = c.children; if (b.length && Array.from(b).every(x => x.tagName === 'BUTTON' && x.hasAttribute('aria-pressed'))) c.classList.add('cel-pilha'); });
  const cel = celQuadro('larga', 'Praticar', 'Mexa e veja o resultado na hora');
  cel.append(corpo); area.append(cel);
}

length+' / 220'; $('#bCnt').className='cnt'+(v.length>220?' bad':'');\n  $('#bBusca').innerHTML=v.length>65?v.slice(0,65)+'<s>'+v.slice(65)+'<\/s>':v;\n}\n$('#bLap').onclick=()=>{$('#bEd').hidden=!$('#bEd').hidden;$('#bHl').hidden=!$('#bEd').hidden};\n$('#bIn').addEventListener('input',bAtual); $$('#bEd .chip').forEach(c=>c.onclick=()=>{$('#bIn').value=c.dataset.v;bAtual()});\n$('#bOk').onclick=()=>{$('#bHl').textContent=$('#bIn').value;$('#bEd').hidden=true;$('#bHl').hidden=false};\nbAtual();\n"},"4":{"t":"Editar “Sobre”","html":"<section class=\"ex\" data-n=\"4\">\n  <div class=\"ex-h\"><span class=\"ex-l\">Cap. 4<\/span><h2>Editar “Sobre”<\/h2><\/div>\n  <p class=\"ex-d\"><b>Aulas:<\/b> 4.1 e 4.2 (blocos do Sobre e construtor). A prévia mostra o corte antes do “ver mais” (~300 caracteres).<\/p>\n  <div class=\"tela\"><div class=\"exbar\"><button class=\"btn p fill\" data-cap=\"4\">✦ Preencher com o exemplo da Marina<\/button><\/div><div class=\"li\"><div class=\"modal-h\"><h3>Editar Sobre<\/h3><span class=\"mut\">✕<\/span><\/div><div class=\"li-b\"><textarea class=\"in\" id=\"s4\" style=\"min-height:150px\" placeholder=\"Fale de você, do que faz e do que busca…\"><\/textarea><div class=\"cnt\" id=\"s4c\">0 / 2.600<\/div>\n<button class=\"btn\" id=\"s4ex\">✦ Usar exemplo da Marina<\/button>\n<div class=\"mut\" style=\"margin:10px 0 4px\">Como aparece no perfil (antes do “ver mais”)<\/div><div class=\"li li-b\"><div class=\"msg\" id=\"s4p\" style=\"background:#fff;padding:0\"><\/div><\/div><ul class=\"ck\" id=\"s4ck\"><\/ul><\/div><div class=\"modal-f\"><button class=\"btn\">Cancelar<\/button><button class=\"btn p\">Salvar<\/button><\/div><\/div><\/div>\n<\/section>","js":"/* 4 */\nconst EX4='Sou analista de Recrutamento e Seleção em Porto Alegre, com 3 anos conduzindo processos seletivos da triagem à proposta. Já conduzi mais de 45 processos e reduzi o tempo médio de contratação de 38 para 27 dias.\\n\\nTrabalho com entrevista por competências, onboarding e relação com gestores. Busco uma vaga onde possa ajudar a contratar melhor. Vamos conversar? Escreva para marina@exemplo.com';\nconst k4=checklist('#s4ck',[['Começa dizendo quem você é e o que faz',t=>/^(sou|atuo|trabalho)/i.test(t.trim())],['Tem palavras-chave da vaga nos 300 primeiros caracteres',t=>/recrutamento|seleção/i.test(t.slice(0,300))],['Tem pelo menos um número',t=>/\\d/.test(t)],['Termina com um convite para contato',t=>/conversar|escreva|fale|contato/i.test(t)]],()=>$('#s4').value);\nfunction a4(){const t=$('#s4').value;$('#s4c').textContent=t.length.toLocaleString('pt-BR')+' / 2.600';$('#s4c').classList.toggle('bad',t.length>2600);\n  $('#s4p').innerHTML=t.length>300?t.slice(0,300).replace(/<\/g,'&lt;')+'… <b style=\"color:var(--brand)\">ver mais<\/b> <span class=\"cut\"><s>'+t.slice(300,360).replace(/<\/g,'&lt;')+'<\/s><\/span>':(t.replace(/<\/g,'&lt;')||'<span class=\"mut\">O texto aparece aqui.<\/span>');k4()}\n$('#s4').oninput=a4;$('#s4ex').onclick=()=>{$('#s4').value=EX4;a4()};a4();\n"},"5":{"t":"Janela “Editar experiência”","html":"<section class=\"ex\" data-n=\"5\">\n  <div class=\"ex-h\"><span class=\"ex-l\">Cap. 5<\/span><h2>Janela “Editar experiência”<\/h2><\/div>\n  <p class=\"ex-d\"><b>Aulas:<\/b> 5.1 a 5.4 (cargo, blocos, construtor, escolha de experiências). Prévia do perfil ao lado e checklist ao vivo. <i>(base: layout A do exemplo anterior)<\/i><\/p>\n  <div class=\"tela\"><div class=\"exbar\"><button class=\"btn p fill\" data-cap=\"5\">✦ Preencher com o exemplo da Marina<\/button><\/div><div class=\"li\">\n    <div class=\"modal-h\"><h3>Editar experiência<\/h3><span class=\"mut\">✕<\/span><\/div>\n    <div class=\"li-b dois\">\n      <div>\n        <label class=\"f\">Cargo*<\/label><input class=\"in\" id=\"aCargo\" value=\"Analista de Recrutamento e Seleção\" maxlength=\"100\">\n        <label class=\"f\">Empresa*<\/label><input class=\"in\" id=\"aEmp\" value=\"Empresa X (exemplo)\">\n        <label class=\"f\">Descrição<\/label><textarea cl tela\"><div class=\"exbar\"><button class=\"btn p fill\" data-cap=\"14\">✦ Preencher com o exemplo da Marina<\/button><\/div><div class=\"li\"><div class=\"modal-h\"><h3>Idiomas<\/h3><span class=\"mut\">✕<\/span><\/div><div class=\"li-b\"><label class=\"f\">Idioma<\/label><select class=\"in\" data-o=\"l14\"><option>Inglês<\/option><option>Espanhol<\/option><option>Francês<\/option><\/select><label class=\"f\">Nível<\/label><select class=\"in\" data-o=\"v14\"><option>Básico<\/option><option>Intermediário<\/option><option>Avançado<\/option><option>Fluente ou bilíngue<\/option><option>Nativo<\/option><\/select><div class=\"mut\" style=\"margin:6px 0 2px\" id=\"p14\"><\/div><\/div>\n<hr class=\"sep\"><div class=\"li-b\"><b>Interesses<\/b><div class=\"mut\">Siga para o feed mostrar a sua área<\/div><div class=\"chips\" id=\"i14\"><\/div><\/div>\n<hr class=\"sep\"><div class=\"li-b\"><b>Causas<\/b><div class=\"mut\">Escolha até 3 que combinem com você<\/div><div class=\"chips\" id=\"c14\"><\/div><div class=\"mut\" id=\"cn14\"><\/div><\/div><\/div><\/div>\n<\/section>","js":"/* 14 */\nfunction p14(){$('#p14').textContent='No perfil: '+$('#cap14 select').value+' — '+$$('#cap14 select')[1].value}$$('#cap14 select').forEach(s=>s.onchange=p14);p14();\n['Recrutamento','RH','Liderança','Empresas de tecnologia','Carreira'].forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent='+ '+t;b.onclick=()=>{b.classList.toggle('on');b.textContent=(b.classList.contains('on')?'✓ ':'+ ')+t};$('#i14').append(b)});\nconst c14=new Set();['Educação','Saúde','Meio ambiente','Igualdade','Direitos humanos','Redução da pobreza'].forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(c14.has(t)){c14.delete(t);b.classList.remove('on')}else if(c14.size<3){c14.add(t);b.classList.add('on')}else{$('#cn14').textContent='Limite de 3 causas. Tire uma para colocar outra.';return}$('#cn14').textContent=c14.size+' de 3 escolhidas'};$('#c14').append(b)});\n\n"},"15":{"t":"Janela “Open to Work”","html":"<section class=\"ex\" data-n=\"15\">\n  <div class=\"ex-h\"><span class=\"ex-l\">Cap. 15<\/span><h2>Janela “Open to Work”<\/h2><\/div>\n  <p class=\"ex-d\"><b>Aulas:<\/b> 15.1 (Open to Work e privacidade). Veja o efeito na foto. <i>(base: layout F do exemplo anterior)<\/i><\/p>\n  <div class=\"tela\"><div class=\"exbar\"><button class=\"btn p fill\" data-cap=\"15\">✦ Preencher com o exemplo da Marina<\/button><\/div><div class=\"li\">\n    <div class=\"modal-h\"><h3>Mostrar que você busca vagas<\/h3><span class=\"mut\">✕<\/span><\/div>\n    <div class=\"li-b\">\n      <div class=\"foto\"><div class=\"av pf\" id=\"fAv\"><img class=\"pf-f\" alt=\"Foto da Marina\" src=\"{{FOTO}}\"><img class=\"pf-a\" alt=\"\" src=\"{{ANEL}}\"><\/div><div><b>Marina Souza<\/b><div class=\"mut\">Analista de RH<\/div><span class=\"sel\" id=\"fSel\" hidden>#OpenToWork<\/span><\/div><\/div>\n      <div class=\"op\" data-o=\"todos\"><span class=\"rd\"><\/span><div><b>Todos os membros do LinkedIn<\/b><div class=\"mut\">O selo aparece na foto, para qualquer pessoa.<\/div><\/div><\/div>\n      <div class=\"op\" data-o=\"rec\"><span class=\"rd\"><\/span><div><b>Só recrutadores<\/b><div class=\"mut\">Sem selo na foto; só quem usa o LinkedIn Recruiter vê.<\/div><\/div><\/div>\n      <div class=\"op\" data-o=\"nao\"><span class=\"rd\"><\/span><div><b>Não ativar agora<\/b><div class=\"mut\">Você continua no LinkedIn, sem sinalizar nada.<\/div><\/div><\/div>\n      <div class=\"res-box\" id=\"fRes\">Escolha uma opção para ver o efeito.<\/div>\n    <\/div>\n  <\/div><\/div>\n<\/section>","js":"/* F */\nconst FX={todos:['ok','Selo verde na foto e na busca. Bom para quem está desempregada e quer ser achada rápido. Qualquer pessoa vê, inclusive no emprego atual.','Aparece para todos'],rec:['','Sem selo: só recrutadores com Recruiter veem. Bom para quem está empregada e quer discrição. Alcance menor que o selo aberto.','só recrutadores   const D = CONTEUDO.aulas['7.1'];
  const lista = h('div', { style: 'display:grid;gap:8px' });
  D.apps.forEach(a => {
    const nota = h('div', { class: 'nota-pequena', 'aria-live': 'polite' }), bar = h('div', { class: 'acoes' });
    const bs = [['Conectar', true], ['Não conectar', false]].map(([rot, conecta]) => { const b = h('button', { class: 'btn peq' }, rot);
      b.addEventListener('click', () => { bs.forEach(x => x.style.borderColor = ''); b.style.borderColor = 'var(--brand)'; nota.textContent = conecta ? a.sim : a.nao; }); bar.append(b); return b; });
    lista.append(h('div', { class: 'hl-card' }, h('b', {}, a.nome), h('span', {}, a.desc), bar, nota));
  });
  el.append(lista, h('p', { class: 'nota-pequena' }, 'Lembrete: deixar a seção vazia não prejudica o perfil. O ponto é só conectar o que você realmente usa.'));
}

/* ---- Capítulo 8: práticas (Licenças e certificados) ---- */
function CertificadosEscolha(el) {
  const D = CONTEUDO.aulas['8.1'];
  const NIVEIS = [['d', 'Com detalhes'], ['b', 'Só o básico'], ['n', 'Deixar de fora']], esc = {};
  const res = h('div', { class: 'destaque', 'aria-live': 'polite' }, 'Escolha como mostrar cada curso.'), lista = h('div', { style: 'display:grid;gap:8px' });
  D.itens.forEach(it => {
    const bar = h('div', { class: 'acoes' }), nota = h('div', { class: 'nota-pequena', 'aria-live': 'polite' });
    const btns = NIVEIS.map(([k, rot]) => { const b = h('button', { class: 'btn peq' }, rot);
      b.addEventListener('click', () => { esc[it.nome] = k; btns.forEach(x => x.style.borderColor = ''); b.style.borderColor = 'var(--brand)'; nota.textContent = it.dicas[k];
        res.textContent = 'Você escolheu ' + Object.keys(esc).length + ' de ' + D.itens.length + '. Não há limite de cursos: o que importa é o que ajuda o seu objetivo.'; });
      bar.append(b); return b; });
    lista.append(h('div', { class: 'hl-card' }, h('b', {}, it.nome), h('span', {}, it.desc), bar, nota));
  });
  el.append(res, lista);
}


/* ---- Capítulo 14: práticas (Idiomas, interesses e causas) ---- */
function IdiomasNivel(el) {
  const D = CONTEUDO.aulas['14.1'], esc = {};
  const res = h('div', { class: 'destaque', 'aria-live': 'polite' }, 'Escolha o nível de cada idioma.'), lista = h('div', { style: 'display:grid;gap:8px' });
  D.itens.forEach(it => {
    const bar = h('div', { class: 'acoes', style: 'flex-wrap:wrap' }), nota = h('div', { class: 'nota-pequena', 'aria-live': 'polite' });
    const btns = D.niveis.map(([k, rot]) => { const b = h('button', { class: 'btn peq' }, rot);
      b.addEventListener('click', () => {
        esc[it.nome] = k; btns.forEach(x => x.style.borderColor = ''); b.style.borderColor = 'var(--brand)'; nota.textContent = it.dicas[k];
        const certas = D.itens.filter(x => esc[x.nome] === x.certa).length;
        res.textContent = 'Você escolheu ' + Object.keys(esc).length + ' de ' + D.itens.length + ' e acertou o nível de ' + certas + '. A regra: todos os idiomas verdadeiros, cada um com o nível que você sustenta.';
      });
      bar.append(b); return b; });
    lista.append(h('div', { class: 'hl-card' }, h('b', {}, it.nome), h('span', {}, it.desc), bar, nota));
  });
  el.append(res, lista);
}

function InteressesEscolha(el) {
  const D = CONTEUDO.aulas['14.2'], esc = {};
  const res = h('div', { class: 'destaque', 'aria-live': 'polite' }, 'Escolha o que a Marina deve seguir.'), lista = h('div', { style: 'display:grid;gap:8px' });

  });
  el.append(res, lista);
}

function CausasEscolha(el) {
  const D = CONTEUDO.aulas['14.3'], sel = new Set();
  const msg = h('div', { class: 'destaque', 'aria-live': 'polite' }), nota = h('div', { class: 'nota-pequena', 'aria-live': 'polite' }), barra = h('i');
  const BONS = D.causas.filter(c => c.ok).length;
  function avaliar() {
    const bons = D.causas.filter(c => c.ok && sel.has(c.nome)).length, ruins = D.causas.filter(c => !c.ok && sel.has(c.nome)).length;
    barra.style.width = (bons / BONS * 100) + '%';
    msg.textContent = (ruins ? 'Atenção: ' + ruins + (ruins === 1 ? ' causa não tem ligação' : ' causas não têm ligação') + ' com a história da Marina. Desmarque. ' : '') + bons + ' de ' + BONS + ' causas da história dela marcadas. ' + (bons === BONS && !ruins ? 'Perfeito: poucas causas, todas verdadeiras.' : 'Marque só as que combinam com o que ela faz.');
  }
  const chips = h('div', { class: 'chips' }, D.causas.map(c => {
    const b = h('button', { class: 'chip', 'aria-pressed': 'false', onclick: () => {
      if (sel.has(c.nome)) sel.delete(c.nome); else sel.add(c.nome);
      const on = sel.has(c.nome); b.classList.toggle('ok', on && c.ok); b.classList.toggle('bad', on && !c.ok); b.setAttribute('aria-pressed', on);
      nota.textContent = on ? c.dica : ''; avaliar();
    } }, c.nome); return b;
  }));
  el.append(chips, h('div', { class: 'cont' }, h('span', {}, 'Causas da história dela'), h('div', { class: 'barra' }, barra)), nota, msg); avaliar();
}

/* ---- Capítulo 16: práticas (LinkedIn Recruiter) ---- */
function RecruiterFiltros(el) {
  const D = CONTEUDO.aulas['16.1'], abertos = new Set();
  const res = h('div', { class: 'destaque', 'aria-live': 'polite' });
  const atualiza = () => { res.textContent = 'Você abriu ' + abertos.size + ' de ' + D.filtros.length + ' filtros. ' + (abertos.size === D.filtros.length ? 'Pronto: cada filtro aponta para um campo do seu perfil.' : 'Abra todos para ver onde cada um aparece no seu perfil.'); };
  const { cel } = celLista(D.filtros.map(f => ({
    cab: [h('b', {}, f.nome), h('small', {}, 'Alimentado por: ' + f.campo)],
    corpo: [
      h('div', { class: 'hl-card', style: 'font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem' }, f.mock),
      h('div', { style: 'margin-top:6px' }, h('b', {}, 'Como o recrutador usa: '), f.uso),
      h('div', { class: 'destaque', style: 'margin:6px 0 0' }, h('b', {}, 'No seu perfil: '), f.perfil)],
    aoAbrir: () => { abertos.add(f.nome); atualiza(); }
  })), { sub: 'Toque em um filtro para abrir' });
  el.append(res, cel); atualiza();
}

        h('p', {}, h('b', {}, 'O que levar daqui: '), D.resumo),

        cf.tipo === 'quiz' ? Quiz(cf.perguntas, { onDone: concluir }) : Checklist(cf.itens, { onComplete: concluir }), doneBox);

function proximaAula() {
  for (const c of Capitulos.todas()) for (let i = 0; i < c.aulas.length; i++)
    if (!Store.feito(Capitulos.chave(c, c.aulas[i]))) return '#' + c.id + '/' + c.aulas[i].id;
  return null;
}

function moduloDe(c) { return MODULOS.find(m => m.caps.includes(c.id)) || MODULOS[0]; }

function fecharMenu() { document.getElementById('menu').classList.remove('aberto'); }

function renderMenu() {
  const m = document.getElementById('menu'), { cap, aula } = Router.atual();
  m.innerHTML = ''; m.append(h('h2', {}, 'Trilha do tutorial'),
    h('a', { class: 'cap-item inicio-link' + (!cap ? ' atual' : ''), href: '#', onclick: fecharMenu }, h('img', { class: 'ic-inicio', src: ICONE_INICIO, alt: '', width: '24', height: '24' }), h('span', {}, 'Início')));
  MODULOS.forEach((mod, mi) => {
    const cs = mod.caps.map(id => Capitulos.obter(id)).filter(Boolean);
    const total = cs.reduce((n, c) => n + c.aulas.length, 0), ok = cs.reduce((n, c) => n + c.aulas.filter(a => Store.feito(Capitulos.chave(c, a))).length, 0);
    const pct = total ? Math.round(ok / total * 100) : 0;
    const card = h('div', { class: 'mod-card c' + (mi % 6) },
      h('div', { class: 'mod-h' }, h('b', {}, mod.titulo), h('span', {}, 'Módulo ' + (mi + 1) + (total ? ' · ' + ok + '/' + total + ' aulas' : ' · em breve')),
        h('div', { class: 'mod-bar' }, h('i', { style: 'width:' + pct + '%' }))));
    m.append(card);
    cs.forEach(c => {
      const pronto = c.aulas.length > 0, feito = Capitulos.capFeito(c), n = c.aulas.filter(a => Store.feito(Capitulos.chave(c, a))).length;
      card.append(h('button', { class: 'cap-item' + (String(c.id) === cap ? ' atual' : '') + (feito ? ' feito' : '') + (pronto ? '' : ' breve'),
        onclick: () => { Router.ir('#' + c.id); fecharMenu(); } },
        h('span', { class: 'n' }, feito ? '✓' : String(Capitulos.num(c))), h('span', { class: 'tt' }, c.titulo), h('small', {}, pronto ? n + '/' + c.aulas.length : 'em breve')));
      if (String(c.id) === cap && pronto) {
        const sub = h('div', { class: 'sub' });
        c.aulas.forEach(a => {
          const f = Store.feito(Capitulos.chave(c, a));
          const at = String(a.id) === aula;
          sub.append(h('a', { href: '#' + c.id + '/' + a.id, class: (at ? 'atual' : '') + (f ? ' feita' : ''), onclick: fecharMenu, 'aria-current': at ? 'page' : null },
            h('span', { class: 'ic' }, f ? '✓' : at ? '▶' : ''), h('span', { class: 'sub-tt' }, CONTEUDO.aulas[Capitulos.chave(c, a)].titulo),
            f ? h('span', { class: 'sub-st' }, 'Feita') : at ? h('span', { class: 'sub-st agora' }, 'Agora') : null));
        });

function renderProgresso() {
  const t = Capitulos.totalAulas(), f = Capitulos.feitasAulas(), pct = t ? Math.round(f / t * 100) : 0;
  document.getElementById('barraProgI').style.width = pct + '%';
  document.getElementById('barraProg').setAttribute('aria-valuenow', String(pct));
  document.getElementById('progTexto').textContent = f + ' de ' + t + ' aulas concluídas · ' + pct + '%';

  if (bc) { bc.hidden = !prox; bc.textContent = f ? 'Continuar ▶' : 'Começar ▶'; bc.onclick = () => Router.ir(prox); }
}

function rotear() {
  renderMenu(); renderProgresso();
  const { cap, aula } = Router.atual(), c = cap && Capitulos.obter(cap);
  if (!c) return Telas.inicio();
  if (!aula) return Telas.capitulo(c);
  const idx = c.aulas.findIndex(a => String(a.id) === aula);
  if (idx < 0) return Telas.capitulo(c);
  Telas.aula(c, idx);
}

/* BLOCO 5 — BOOT */
(function boot() {
  const raiz = document.documentElement.style;
  if (IMAGENS.foto) { document.body.classList.add('tem-foto-img'); raiz.setProperty('--foto-img', 'url("' + IMAGENS.foto + '")'); }
  if (IMAGENS.foto) {
    const im = new Image();
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 40;
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, 40, 40);
        // média de pequenos cantos superiores (fundo da foto)
        let r = 0, g = 0, b = 0, n = 0;
        [[0, 0], [34, 0], [0, 6], [34, 6]].forEach(([px, py]) => {
          const d = x.getImageData(px, py, 6, 6).data;
          for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
        });
        raiz.setProperty('--foto-bg', 'rgb(' + Math.round(r / n) + ',' + Math.round(g / n) + ',' + Math.round(b / n) + ')');
      } catch (e) { /* mantém a cor padrão */ }
    };
    im.src = IMAGENS.foto;
  }
  if (IMAGENS.banner) { document.body.classList.add('tem-banner-img'); raiz.setProperty('--banner-img', 'url("' + IMAGENS.banner + '")'); }
  Router.iniciar();
  Eventos.on('rota', rotear);
  Eventos.on('progresso', () => { renderMenu(); renderProgresso(); });
  document.getElementById('perfilMock').append(PerfilMock());
  document.getElementById('rodape').textContent = 'Limites do LinkedIn verificados em ' + LIMITES.verificadoEm + '. ' + LIMITES.fonte;
  (function () {
    const btn = document.getElementById('btnMenu'), menu = document.getElementById('menu'), topo = document.querySelector('.topo');
    function sync() {
      const aberto = menu.classList.contains('aberto');
      document.body.classList.toggle('menu-aberto', aberto && window.innerWidth <= 860);
      btn.setAttribute('aria-expanded', aberto ? 'true' : 'false');
      if (aberto && topo) menu.style.setProperty('--menu-top', Math.round(topo.getBoundingClientRect().bottom + 6) + 'px');
    }
    btn.addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('aberto'); sync(); });
    new MutationObserver(sync).observe(menu, { attributes: true, attributeFilter: ['class'] });
    document.addEventListener('click', e => { if (menu.classList.contains('aberto') && !menu.contains(e.target) && !btn.contains(e.target)) menu.classList.remove('aberto'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && menu.classList.contains('aberto')) { menu.classList.remove('aberto'); btn.focus(); } });
    window.addEventListener('resize', sync);
    const medeTopo = () => { if (topo) document.documentElement.style.setProperty('--topo-h', Math.round(topo.getBoundingClientRect().height + 6) + 'px'); };
    medeTopo(); window.addEventListener('resize', medeTopo); window.addEventListener('load', medeTopo);
  })();
  document.getElementById('btnReset').addEventListener('click', () => {
    if (!window.confirm('Apagar todo o progresso e recomeçar a trilha?')) return;
    Store.reiniciar();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
    rotear();
  });
  rotear();
})();
