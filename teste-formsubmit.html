<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Teste FormSubmit</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;max-width:520px;margin:2rem auto;padding:0 1rem;line-height:1.5}
  select,input,button{font:inherit;padding:.6rem;width:100%;margin:.4rem 0;box-sizing:border-box}
  button{background:#2563eb;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<h2>Teste do FormSubmit</h2>
<p>Escolha o e-mail, anexe qualquer PDF e clique em enviar. Vai abrir uma página do FormSubmit: <strong>tire um print dela</strong> e me envie. Depois confira o Gmail (Principal, Promoções, Atualizações e Spam).</p>

<form id="f" method="POST" enctype="multipart/form-data" action="https://formsubmit.co/selecao.orizon@gmail.com">
  <label>E-mail que vai receber:
    <select id="dest" onchange="document.getElementById('f').action='https://formsubmit.co/'+this.value">
      <option value="selecao.orizon@gmail.com">selecao.orizon@gmail.com</option>
      <option value="orizonrh.consultoria@gmail.com">orizonrh.consultoria@gmail.com</option>
    </select>
  </label>
  <input type="hidden" name="_subject" value="TESTE — currículo recebido"/>
  <input type="hidden" name="_template" value="table"/>
  <input type="text" name="nome" value="Teste Candidato" />
  <input type="file" name="attachment" accept=".pdf,.doc,.docx" required/>
  <button type="submit">Enviar teste</button>
</form>
</body>
</html>
