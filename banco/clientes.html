<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Clientes / Titulares — Cartas de Conta · Orizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap"/>
<link rel="stylesheet" href="assets/cr-core.css"/>
<link rel="stylesheet" href="assets/cab.css"/>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('cr_theme')||'dark')}catch(e){}</script>

<script src="assets/cr-brand.js"></script>
</head>
<body>
<div class="app">
<aside class="sidebar" id="crSidebar"></aside>
<div class="main">
  <div class="mob-overlay" id="mobOverlay" onclick="closeSidebar()"></div>
  <div class="topbar">
    <div class="tb-left">
      <button class="mob-menu-btn" onclick="toggleSidebar()" aria-label="Abrir menu">☰</button>
      <div class="tb-bc"><strong>Hub</strong><span style="opacity:.3">›</span><span>Clientes / Titulares</span></div>
    </div>
    <div class="tb-right"><span class="tb-clock" id="tb-clock"></span></div>
  </div>
  <div class="content">

    <div class="welcome"><div><div class="wl-title">🧑 <em>Clientes</em></div><div class="wl-sub">Pessoas que abrem a conta (CPF validado; na lista aparece mascarado)</div></div><button class="btn btn-primary btn-sm" onclick="CABCrud.abrir()">➕ Novo</button></div>
    <div class="panel"><div class="panel-hd"><span class="panel-title">🧑 Cadastros <span class="c-muted" id="cnt" style="font-weight:400;font-size:.76rem"></span></span>
      <div class="panel-actions"><div class="search-box">🔍 <input id="busca" placeholder="Buscar..." oninput="CABCrud.desenhar()" aria-label="Buscar"/></div></div></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Nome</th><th>CPF</th><th>Vínculo</th><th>Telefone</th><th>Ações</th></tr></thead><tbody id="tb"></tbody></table></div></div>
    <div class="modal-bg" id="modal" onclick="if(event.target===this)CABCrud.fechar()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <button class="modal-close" onclick="CABCrud.fechar()" aria-label="Fechar">✕</button><h3 id="mt"></h3><div id="mf"></div>
      <div style="display:flex;gap:.45rem;justify-content:flex-end;margin-top:.6rem"><button class="btn btn-ghost" onclick="CABCrud.fechar()">Cancelar</button><button class="btn btn-primary" onclick="CABCrud.salvar()">💾 Salvar</button></div></div></div>
  </div>
</div>
</div>
<div id="toast-ct"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="void 0"></script>
<script src="assets/cr-config.js"></script>
<script src="assets/cab-carta.js"></script>
<script src="assets/cr-demo.js"></script>
<script src="assets/cr-auth.js"></script>
<script src="assets/cr-utils.js"></script>
<script src="assets/cr-shell.js"></script>
<script src="assets/cr-a11y.js"></script>
<script src="assets/cab-crud.js"></script>
<script>
CABCrud.init({tabela:'cab_titulares',singular:'titular',plural:'titulares',icone:'🧑',colunas:['nome','cpf','vinculo','telefone'],campos:[{k:'nome',l:'Nome completo',req:1},{k:'cpf',l:'CPF',mask:'cpf',req:1,ph:'000.000.000-00'},{k:'rg',l:'RG'},{k:'vinculo',l:'Cargo ou vínculo'},{k:'email',l:'E-mail',tipo:'email'},{k:'telefone',l:'Telefone',mask:'tel'}]});
</script>
</body>
</html>
